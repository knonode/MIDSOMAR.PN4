<!DOCTYPE html>
<html>
<head>
    <title>3003 Numbered Pyramid</title>
    <style>
        body { 
            font-family: monospace; 
            text-align: center; 
            line-height: 1;
            font-size: 11px;
            letter-spacing: -0.5px;
            word-spacing: -2px;
            background-color: #262626;
            color: #a7ffea;
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>
<body>
    <div id="pyramid"></div>

    <script>
        function generatePyramid(totalItems) {
            const pyramid = [];
            let itemsUsed = 0;
            let currentNumber = 0;

            while (itemsUsed < totalItems) {
                const rowNumbers = Array(77 - currentNumber).fill(currentNumber);
                pyramid.push(rowNumbers.map(n => n.toString().padStart(2, '0')));
                itemsUsed += rowNumbers.length;
                currentNumber++;
            }

            return pyramid;
        }

        function renderPyramid(pyramid) {
            const pyramidElement = document.getElementById('pyramid');
            pyramid.forEach(row => {
                const rowElement = document.createElement('div');
                rowElement.textContent = row.join(' ');
                pyramidElement.appendChild(rowElement);
            });
        }

        const pyramid = generatePyramid(3003);
        renderPyramid(pyramid);
    </script>
</body>
</html>
